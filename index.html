let currentQ = [], idx = 0, score = 0, timer, timeLeft = 60;

function goTo(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function startQ(num) {
    currentQ = [...data].sort(() => Math.random() - 0.5).slice(0, num);
    idx = 0; score = 0;
    
    // リザルト画面の状態やエフェクトをリセット
    const resPage = document.getElementById('p-res');
    resPage.classList.remove('pass', 'fail');
    document.getElementById('confetti').classList.remove('show');
    document.getElementById('confetti').innerHTML = '';
    document.getElementById('firework').classList.remove('show');
    document.getElementById('firework').innerHTML = '';
    
    goTo('p-quiz');
    render();
}

function render() {
    clearInterval(timer);
    document.getElementById('q-text').innerText = (idx + 1) + ". " + currentQ[idx].q;
    timeLeft = 60;
    const bar = document.getElementById('timer-bar');
    timer = setInterval(() => {
        timeLeft -= 0.1;
        bar.style.width = (timeLeft / 60 * 100) + "%";
        if(timeLeft <= 0) handleAns(null);
    }, 100);
}

function handleAns(val) {
    if(val === currentQ[idx].a) score++;
    idx++;
    if(idx < currentQ.length) {
        render();
    } else {
        finish();
    }
}

// コンフェッティ（花びら＋四角＋星）生成関数
function makeConfetti() {
    const confetti = document.getElementById('confetti');
    confetti.innerHTML = '';
    const colors = ['#ff1744','#ff9100','#ffee58','#00c853','#00b0ff','#304ffe','#d500f9','#ff80ab','#ffe57f'];
    const shapes = ['', 'petal', 'petal', 'star'];
    const count = 100;
    for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        piece.className = 'confetti-piece ' + shape;
        const size = 8 + Math.random() * 14;
        piece.style.left = Math.random() * 100 + '%';
        piece.style.width = size + 'px';
        piece.style.height = shape === 'star' ? size + 'px' : (size * 1.8) + 'px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (3.5 + Math.random() * 4.5) + 's';
        piece.style.animationDelay = (Math.random() * 3) + 's';
        piece.style.opacity = String(0.7 + Math.random() * 0.3);
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        confetti.appendChild(piece);
    }
}

// 花火バースト生成関数
function makeFireworks() {
    const firework = document.getElementById('firework');
    firework.innerHTML = '';
    firework.classList.add('show');
    const colors = ['#ff1744','#ff9100','#ffee58','#00c853','#00b0ff','#d500f9'];
    const bursts = 5;
    for (let b = 0; b < bursts; b++) {
        const bx = 10 + Math.random() * 80;
        const by = 5 + Math.random() * 50;
        setTimeout(() => {
            const NUM_SPARKS = 16;
            for (let s = 0; s < NUM_SPARKS; s++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                const angle = (s / NUM_SPARKS) * Math.PI * 2;
                const dist = 60 + Math.random() * 80;
                spark.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                spark.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                spark.style.left = bx + '%';
                spark.style.top = by + '%';
                spark.style.background = colors[Math.floor(Math.random() * colors.length)];
                spark.style.width = (4 + Math.random() * 4) + 'px';
                spark.style.height = spark.style.width;
                firework.appendChild(spark);
            }
        }, b * 350);
    }
}

function finish() {
    clearInterval(timer);
    goTo('p-res');
    
    const total = currentQuestions.length;
    const pass = (score / total) >= 0.8;
    const resPage = document.getElementById('p-res');
    
    resPage.classList.remove('pass', 'fail');
    resPage.classList.add(pass ? 'pass' : 'fail');
    
    document.getElementById('res-msg').innerText = `結果: ${score} / ${total}`;
    
    const judgeBox = document.getElementById('judge-box');
    judgeBox.innerText = pass ? "合格" : "不合格";
    
    const confettiEl = document.getElementById('confetti');
    const fireworkEl = document.getElementById('firework');
    
    if (pass) {
        makeConfetti();
        confettiEl.classList.add('show');
        makeFireworks();
    } else {
        confettiEl.classList.remove('show');
        confettiEl.innerHTML = '';
        fireworkEl.classList.remove('show');
        fireworkEl.innerHTML = '';
    }
}
